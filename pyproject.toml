[project]
name = "reporte"
version = "0.1.0"
description = "Reporte de gasto mensual"
requires-python = ">=3.14"
dependencies = ["pandas>=2.3,<2.4", "Jinja2>=3.1,<3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs>=2.3,<2.4", "Faker==40.43.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["sistema: suite de sistema de punta a punta (generador + reporte real)"]

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Solo Python: el Markdown (docs, skills) y lo generado por herramientas no pasa por ruff.
extend-exclude = ["*.md", ".claude", "openspec", "graft"]
